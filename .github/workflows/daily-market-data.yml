name: Daily market data pipeline

on:
  schedule:
    - cron: "17 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Download, validate, and screen
        run: python -m market_pipeline --output-dir data --report-path validation_report.json
      - name: Upload data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-${{ github.run_id }}
          path: |
            data/
            validation_report.json
      - name: Commit successful snapshot
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/us_screen.csv data/crypto_screen.csv validation_report.json
          git diff --cached --quiet || git commit -m "Update daily market data snapshot"
          git push

