name: Daily market data pipeline

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-data-main
  cancel-in-progress: false

jobs:
  run:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Download, validate, and screen
        run: python -m market_pipeline --output-dir data --report-path validation_report.json
      - name: Check summary data freshness and report schema
        run: python -m market_pipeline.report_gate --report-path validation_report.json --us-path data/us_screen.csv --crypto-path data/crypto_screen.csv
      - name: Upload data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-${{ github.run_id }}
          path: |
            data/
            validation_report.json
      - name: Commit successful snapshot
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git reset --soft origin/main
          git add data/us_screen.csv data/crypto_screen.csv validation_report.json
          git diff --cached --quiet || git commit -m "Update daily market data snapshot"
          git push origin HEAD:main
