name: Daily market data pipeline

on:
  push:
    branches: ["main"]
  schedule:
    # Primary: 08:10 Asia/Taipei = 00:10 UTC, after the latest UTC daily candle closes.
    - cron: "10 0 * * *"
    # Recovery: 08:40 Asia/Taipei = 00:40 UTC if the primary scheduled run was delayed or missed.
    - cron: "40 0 * * *"
    # Final recovery: 09:05 Asia/Taipei = 01:05 UTC before the summary window.
    - cron: "5 1 * * *"
    # Last recovery: 09:15 Asia/Taipei = 01:15 UTC before the 09:20 summary.
    - cron: "15 1 * * *"
    # Catch-up: 10:10 Asia/Taipei = 02:10 UTC if GitHub delayed the morning schedules.
    - cron: "10 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-data-main
  cancel-in-progress: true

jobs:
  run:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Skip duplicate daily run when today's snapshot is already fresh
        id: freshness
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path("data/daily_summary_input.json")
          already_fresh = False
          try:
              payload = json.loads(path.read_text(encoding="utf-8"))
              generated = datetime.fromisoformat(
                  payload["generated_at_taipei"].replace("Z", "+00:00")
              )
              already_fresh = (
                  generated.astimezone(ZoneInfo("Asia/Taipei")).date()
                  == datetime.now(ZoneInfo("Asia/Taipei")).date()
                  and payload.get("overall_status") == "pass"
                  and payload.get("failed") == 0
                  and payload.get("us_benchmark", {}).get("status") == "pass"
                  and payload.get("us_benchmark", {}).get("last_date")
                  == payload.get("data_as_of", {}).get("us")
                  and payload.get("summary_gate", {}).get("status")
                  in {"ready", "ready_with_warnings"}
                  and os.environ.get("GITHUB_EVENT_NAME") == "schedule"
              )
          except (OSError, KeyError, TypeError, ValueError, json.JSONDecodeError):
              pass

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"already_fresh={'true' if already_fresh else 'false'}\n")
          print(f"already_fresh={already_fresh}")
          PY

      - name: Download, validate, and screen
        if: steps.freshness.outputs.already_fresh != 'true'
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "market data attempt $attempt/3"
            if python -m market_pipeline --output-dir data --report-path validation_report.json; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done
          exit 1
      - name: Check summary data freshness, coverage, and correctness
        if: steps.freshness.outputs.already_fresh != 'true'
        run: python -m market_pipeline.report_gate --report-path validation_report.json --us-path data/us_screen.csv --crypto-path data/crypto_screen.csv
      - name: Build yesterday watchlist backtest
        if: steps.freshness.outputs.already_fresh != 'true'
        run: python -m market_pipeline.backtest --data-dir data --report-path validation_report.json --history-path data/observation_history.json --output-path data/backtest.json
      - name: Build canonical daily summary input
        if: steps.freshness.outputs.already_fresh != 'true'
        run: python -m market_pipeline.summary_export --report-path validation_report.json --us-path data/us_screen.csv --crypto-path data/crypto_screen.csv --backtest-path data/backtest.json --output-path data/daily_summary_input.json
      - name: Build readable Markdown daily summary
        if: steps.freshness.outputs.already_fresh != 'true'
        run: python -m market_pipeline.daily_summary --input-path data/daily_summary_input.json --output-path data/daily_summary.md
      - name: Upload data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-${{ github.run_id }}
          path: |
            data/
            validation_report.json
      - name: Commit successful snapshot
        if: success() && steps.freshness.outputs.already_fresh != 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git reset --soft origin/main
          git add data/us_screen.csv data/crypto_screen.csv data/backtest.json data/observation_history.json data/daily_summary_input.json data/daily_summary.md validation_report.json
          git diff --cached --quiet || git commit -m "Update daily market data snapshot"
          git push origin HEAD:main
